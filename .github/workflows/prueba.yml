name: Comprobar Token Local vs Secret

on: [push]

jobs:
  verificar-token:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN de GitHub con LOCAL_DEV_TOKEN del Runner
        env:
          GH_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          $localToken = $env:LOCAL_DEV_TOKEN
          $secretToken = $env:GH_DEV_TOKEN
          
          Write-Output "Comprobando variables..."
          if ($localToken -eq $secretToken) {
              Write-Output "✅ Los tokens coinciden correctamente."
              exit 0
          } else {
              Write-Error "❌ Los tokens NO coinciden."
              exit 1
          }