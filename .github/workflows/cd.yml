name: CD - Continuous Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Incrementar versión en README
        run: |
          echo "AppVersion-1 (con fecha $(date))" >> README.md
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Bump versión de producción" || echo "Sin cambios"

  validate-prod:
    needs: update-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN contra variable local
        env:
          GH_PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        shell: powershell
        run: |
          $localToken = $env:LOCAL_PROD_TOKEN
          $secretToken = $env:GH_PROD_TOKEN
          
          Write-Output "Comprobando PROD_TOKEN..."
          if ($localToken -eq $secretToken) {
              Write-Output "✅ Los tokens de producción coinciden correctamente."
              exit 0
          } else {
              Write-Error "❌ Los tokens de producción NO coinciden."
              exit 1
          }